[package]
name = "create-linux-desktop-shortcut"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
ashpd = { version = "0.14.0", features = ["tokio", "screenshot"] }
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }
